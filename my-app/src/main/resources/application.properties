# Datasource (override via environment variables in non-local environments)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:postgres}
quarkus.datasource.password=${DB_PASSWORD:P@ssw0rd01}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/my-db}

# Hibernate
quarkus.hibernate-orm.database.generation=update
%prod.quarkus.hibernate-orm.database.generation=validate

# Tests run against their own database so they never touch local dev data
%test.quarkus.datasource.jdbc.url=${TEST_DB_URL:jdbc:postgresql://localhost:5432/my-db-test}
%test.quarkus.hibernate-orm.database.generation=drop-and-create
