# Datasource (override via environment variables in non-local environments)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:postgres}
quarkus.datasource.password=${DB_PASSWORD:P@ssw0rd01}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/my-db}

# Schema migrations (DEMO-141): Flyway owns the schema, Hibernate only validates it.
# Add changes as new versioned files in src/main/resources/db/migration; never edit an applied one.
quarkus.flyway.migrate-at-start=true
# A database that already holds the schema (built by hibernate "update" before Flyway) has no
# flyway_schema_history: baseline it at V1 so only V2 onwards runs. Empty databases migrate normally.
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=1

# Hibernate never alters the schema in any profile.
quarkus.hibernate-orm.database.generation=validate

# Tests run against their own database so they never touch local dev data
%test.quarkus.datasource.jdbc.url=${TEST_DB_URL:jdbc:postgresql://localhost:5432/my-db-test}
# The test schema is built by the Flyway migrations on a clean database, then validated by Hibernate.
%test.quarkus.flyway.clean-at-start=true
%test.quarkus.hibernate-orm.database.generation=validate

# JWT (DEMO-90)
# Tokens issued by POST /users/login expire 3600 seconds (1 hour) after issue.
app.auth.jwt.issuer=${JWT_ISSUER:https://my-proj.example.com}
app.auth.jwt.lifespan=3600S
mp.jwt.verify.issuer=${app.auth.jwt.issuer}
# In dev and test Quarkus generates a throwaway RSA key pair automatically.
# In prod the keys must be supplied; never commit them.
%prod.smallrye.jwt.sign.key.location=${JWT_SIGN_KEY_LOCATION}
%prod.mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_LOCATION}

# Access control (DEMO-129)
# Deny by default: every JAX-RS endpoint needs an explicit @RolesAllowed, @Authenticated or @PermitAll.
quarkus.security.jaxrs.deny-unannotated-endpoints=true
# Authenticate inside the JAX-RS layer so 401/403 are rendered as JSON ErrorResponse bodies.
quarkus.http.auth.proactive=false
